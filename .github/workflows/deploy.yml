# GitHub Pages 자동 배포
# main 브랜치에 코드를 올리면(push) 자동으로 테스트 → 빌드 → 배포가 진행된다.
# 배포 결과:
#   https://<내 아이디>.github.io/<저장소 이름>/               ← 학생들이 접속하는 주소
#   https://<내 아이디>.github.io/<저장소 이름>/graduation.html ← HTML 한 파일 (내려받아서 쓰는 용도)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub 화면에서 "Run workflow" 버튼으로 직접 실행할 수도 있다

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 테스트 (실패하면 배포하지 않는다)
        run: npm test

      - name: 웹페이지 빌드
        run: npm run build

      - name: HTML 한 파일 빌드
        run: npm run build:single

      - name: HTML 한 파일을 배포 폴더에 함께 넣기
        run: cp dist-single/index.html dist/graduation.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
